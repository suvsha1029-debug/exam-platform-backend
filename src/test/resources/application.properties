spring.datasource.url=jdbc:h2:mem:exam_platform_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
server.forward-headers-strategy=framework

app.admin.username=admin
app.admin.password=admin123
app.master-admin.email=master@example.com
app.upload.dir=build/test-uploads
app.viewer.python-script=tools/gate_exam_viewer.py
app.viewer.python-command=python
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=false
