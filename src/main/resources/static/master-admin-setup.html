<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Master Admin Setup</title>
  <style>
    * { box-sizing:border-box; border-radius:0!important; box-shadow:none!important; text-shadow:none!important; }
    body { margin:0; min-height:100vh; color:#10243f; background:#d8e5f2; font-family:Tahoma,Verdana,Arial,sans-serif; }
    header { padding:13px 18px; color:#fff; background:#0b4f91; border-bottom:3px solid #062f5b; }
    h1 { margin:0; font-size:23px; }
    main { width:min(780px,calc(100% - 28px)); margin:34px auto; border:1px solid #7295bd; background:#f7fbff; padding:18px; }
    h2 { margin:0 0 15px; font-size:20px; }
    .fields { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
    label { display:block; margin-bottom:5px; color:#173e70; font-size:13px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; }
    input { width:100%; border:1px solid #6e8fb5; padding:9px; background:#fff; color:#10243f; font:14px Tahoma,Verdana,Arial,sans-serif; }
    button,a { display:inline-block; margin-top:15px; min-height:35px; border:1px solid #063b72; padding:8px 14px; color:#fff; background:#0d5ca6; font:700 13px Tahoma,Verdana,Arial,sans-serif; cursor:pointer; text-decoration:none; }
    .status { min-height:20px; margin-top:12px; font-size:13px; font-weight:700; }
    .ok { color:#126c39; } .bad { color:#a92d42; }
    @media (max-width:650px) { .fields { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header><h1>Master Admin Setup</h1></header>
  <main>
    <h2>Set Or Reset Password</h2>
    <form id="setupForm">
      <div class="fields">
        <div><label for="setupEmail">Email</label><input id="setupEmail" type="email" required></div>
        <div><label for="setupName">Full Name</label><input id="setupName" required></div>
        <div><label for="setupPhone">Phone Number</label><input id="setupPhone" inputmode="tel" required></div>
        <div><label for="setupDob">Date Of Birth</label><input id="setupDob" type="date" required></div>
        <div><label for="setupPassword">New Password</label><input id="setupPassword" type="password" minlength="12" autocomplete="new-password" required></div>
      </div>
      <button type="submit">Save Password</button>
      <a href="/login">Sign In</a>
      <div id="setupStatus" class="status"></div>
    </form>
  </main>
  <script>
    const status = (message, good = false) => {
      const el = document.getElementById('setupStatus');
      el.className = 'status ' + (good ? 'ok' : 'bad');
      el.textContent = message || '';
    };
    document.getElementById('setupForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      try {
        const response = await fetch('/api/admin-access/setup-password', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({
            email:setupEmail.value,
            adminName:setupName.value,
            phoneNumber:setupPhone.value,
            dateOfBirth:setupDob.value,
            password:setupPassword.value
          })
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.detail || data.message || 'Setup failed.');
        status(data.message || 'Password saved.', true);
      } catch (error) {
        status(error.message);
      }
    });
  </script>
</body>
</html>
