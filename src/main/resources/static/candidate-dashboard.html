<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Candidate Dashboard</title>
  <link rel="stylesheet" href="/assets/candidate-institutional.css">
  <script src="/assets/candidate-institutional.js" defer></script>
  <style>
    :root {
      --blue: #0d5ca6;
      --blue2: #073a70;
      --line: #9dbce4;
      --ink: #10243f;
      --muted: #607089;
      --good: #116c2e;
      --bad: #b00020;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(255,255,255,.72), transparent 34rem),
        linear-gradient(135deg, #bed9ff 0%, #eaf3ff 48%, #d7e8ff 100%);
    }
    header {
      padding: 18px 28px;
      color: #fff;
      background: linear-gradient(180deg, var(--blue) 0%, var(--blue2) 100%);
      box-shadow: 0 3px 18px rgba(0,0,0,.22);
    }
    header h1 { margin: 0; font-size: 22px; letter-spacing: .02em; }
    header p { margin: 5px 0 0; color: #cfe4ff; font-size: 13px; }
    main {
      width: min(980px, calc(100% - 32px));
      margin: 36px auto;
      display: grid;
      grid-template-columns: minmax(300px, 430px);
      justify-content: center;
      gap: 18px;
      align-items: start;
    }
    .card {
      background: rgba(255,255,255,.72);
      border: 2px solid rgba(157,188,228,.92);
      border-radius: 22px;
      box-shadow: 0 22px 58px rgba(16,36,63,.18);
      padding: 22px;
      backdrop-filter: blur(12px);
    }
    h2 { margin: 0 0 7px; color: var(--blue2); }
    p { margin: 0 0 18px; color: var(--muted); line-height: 1.45; }
    label {
      display: block;
      margin: 14px 0 6px;
      font-size: 12px;
      font-weight: 800;
      color: #264d82;
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    input {
      width: 100%;
      border: 2px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      font-size: 15px;
      outline: none;
      background: rgba(255,255,255,.9);
    }
    input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(13,92,166,.14);
    }
    button, .link-button {
      display: inline-block;
      margin-top: 18px;
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      font-weight: 800;
      color: #fff;
      background: linear-gradient(180deg, #287bd4 0%, #0d5ca6 100%);
      cursor: pointer;
      box-shadow: 0 4px 0 rgba(6,52,103,.28);
      text-decoration: none;
    }
    .muted-button {
      color: var(--blue2);
      background: #eef6ff;
      border: 2px solid var(--line);
      box-shadow: none;
    }
    .danger-button {
      background: linear-gradient(180deg, #d94b4b 0%, #9b1f1f 100%);
    }
    .password-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
    }
    .password-toggle {
      margin-top: 0;
      box-shadow: none;
      white-space: nowrap;
    }
    .result {
      margin-top: 16px;
      padding: 13px;
      border-radius: 12px;
      border: 1px dashed var(--line);
      background: rgba(243,248,255,.86);
      min-height: 64px;
      white-space: pre-wrap;
      font-family: "Courier New", monospace;
      font-size: 13px;
    }
    .ok { color: var(--good); font-weight: 800; }
    .error { color: var(--bad); font-weight: 800; }
    .details {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 14px;
    }
    .item {
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255,255,255,.78);
    }
    .item b {
      display: block;
      margin-bottom: 4px;
      color: #264d82;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .full { grid-column: 1 / -1; }
    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px;
    }
    .correction {
      margin-top: 16px;
      display: none;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .correction.visible { display: grid; }
    textarea {
      width: 100%;
      min-height: 74px;
      border: 2px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      resize: vertical;
      font-size: 15px;
      font-family: Arial, Helvetica, sans-serif;
    }
    dialog {
      max-width: 440px;
      border: 2px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 24px 80px rgba(16,36,63,.32);
      padding: 20px;
    }
    dialog::backdrop { background: rgba(7,22,43,.38); }
    @media (max-width: 820px) {
      main { grid-template-columns: 1fr; }
      .details { grid-template-columns: 1fr; }
    }
    @media (max-width: 640px) {
      header {
        padding: 16px 18px;
      }
      header h1 {
        font-size: 20px;
      }
      main {
        width: min(100%, calc(100% - 18px));
        margin: 18px auto 22px;
      }
      .card {
        padding: 18px 16px;
        border-radius: 18px;
      }
      input,
      textarea {
        font-size: 16px;
      }
      .password-row {
        grid-template-columns: 1fr;
      }
      button,
      .link-button {
        width: 100%;
        justify-content: center;
        text-align: center;
      }
      .actions {
        flex-direction: column;
      }
      dialog {
        width: min(100%, calc(100% - 20px));
        margin: 0 10px;
        padding: 18px 16px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Candidate Dashboard</h1>
  </header>

  <main>
    <section class="card">
      <h2>Login</h2>
      <a class="link-button muted-button" href="/candidate-entry/registration-personal">New user? Register now</a>
      <form id="loginForm">
        <label for="registrationId">Registration ID</label>
        <input id="registrationId" name="registrationId" autocomplete="username" required>

        <label for="password">Password</label>
        <div class="password-row">
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <button id="toggleDashboardPassword" type="button" class="muted-button password-toggle">Show</button>
        </div>

        <button type="submit">Open Dashboard</button>
        <a class="link-button muted-button" href="/candidate-entry/reset-password">Forgot password?</a>
      </form>
      <div id="loginResult" class="result"></div>
    </section>
  </main>

  <dialog id="registerDialog">
    <h2>Registration not found</h2>
    <p>That registration ID/password did not match a candidate record. If you have not registered yet, open the registration form.</p>
    <a class="link-button" href="/candidate-entry/registration-personal">Register Now</a>
    <button class="muted-button" type="button" id="closeDialog">Try Again</button>
  </dialog>

  <script src="/assets/ui-guard.js"></script>
  <script>
    async function jsonRequest(url, payload) {
      const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Candidate-CSRF': await candidateSecurityToken() },
        body: JSON.stringify(payload)
      });
      const text = await response.text();
      const data = text ? JSON.parse(text) : {};
      if (!response.ok) throw new Error(data.detail || data.message || text || response.statusText);
      return data;
    }

    async function candidateSecurityToken() {
      if (window.__candidateSecurityTokenCache) return window.__candidateSecurityTokenCache;
      const response = await fetch('/api/public/candidate-security-token', { cache: 'no-store' });
      const data = await response.json();
      window.__candidateSecurityTokenCache = data.token || '';
      return window.__candidateSecurityTokenCache;
    }

    function escapeHtml(value) {
      return String(value ?? '-')
        .replaceAll('&', '&amp;')
        .replaceAll('"', '&quot;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;');
    }

    document.getElementById('loginForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const result = document.getElementById('loginResult');
      result.textContent = 'Checking login...';
      try {
        const candidate = await jsonRequest('/api/candidate/login', {
          registrationId: document.getElementById('registrationId').value.trim(),
          password: document.getElementById('password').value
        });
        sessionStorage.setItem('candidateDashboardData', JSON.stringify(candidate));
        sessionStorage.removeItem('candidateDashboardPassword');
        localStorage.removeItem('candidateDashboardPassword');
        sessionStorage.removeItem('candidateExamAuth');
        localStorage.removeItem('candidateExamAuth');
        window.location.href = candidate.responsesReleased && candidate.responseSubmitted
          ? '/candidate-entry/details'
          : (candidate.examLobbyAvailable ? '/candidate-entry/exam' : '/candidate-entry/details');
      } catch (error) {
        result.innerHTML = '<span class="error">Login failed</span>\n' + error.message;
        document.getElementById('registerDialog').showModal();
      }
    });

    document.getElementById('closeDialog').addEventListener('click', () => {
      document.getElementById('registerDialog').close();
    });

    document.getElementById('toggleDashboardPassword').addEventListener('click', () => {
      const input = document.getElementById('password');
      const reveal = input.type === 'password';
      input.type = reveal ? 'text' : 'password';
      document.getElementById('toggleDashboardPassword').textContent = reveal ? 'Hide' : 'Show';
    });

    const registeredId = new URLSearchParams(window.location.search).get('registered');
    if (registeredId) {
      document.getElementById('registrationId').value = registeredId;
      document.getElementById('loginResult').innerHTML = '<span class="ok">Registration complete</span>\nUse your password to open the dashboard.';
    }
  </script>
</body>
</html>
