<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Candidate Password Reset</title>
  <link rel="stylesheet" href="/assets/candidate-institutional.css">
  <script src="/assets/candidate-institutional.js" defer></script>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; font-family:Tahoma,Verdana,Arial,sans-serif; background:#f4f1f4; color:#241d28; }
    header { padding:18px max(22px,calc((100vw - 1180px)/2)); color:#fff; text-align:center; background:#21102d; }
    header h1 { margin:0; font-family:Georgia,"Times New Roman",serif; font-size:27px; }
    main { width:min(620px,calc(100% - 30px)); margin:30px auto; }
    .card { padding:22px; border:1px solid #c9bdcb; background:#fff; }
    h2 { margin:0 0 8px; color:#21102d; font-family:Georgia,"Times New Roman",serif; }
    p { margin:0 0 16px; line-height:1.5; color:#514556; }
    label { display:block; margin:14px 0 6px; color:#21102d; font-size:12px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; }
    input { width:100%; padding:11px; border:1px solid #aa9bad; border-radius:0; background:#fff; font-size:15px; }
    input:focus { border-color:#3b174f; outline:2px solid #dfd0e1; }
    button,.button { display:inline-block; margin-top:16px; padding:10px 16px; border:1px solid #21102d; border-radius:0; color:#fff; background:#3b174f; font-weight:800; text-decoration:none; cursor:pointer; }
    button.secondary,.button.secondary { color:#21102d; background:#fff; }
    .captcha-row { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:9px; align-items:end; }
    .captcha-box { margin-top:7px; padding:13px; border:1px solid #741321; color:#21102d; background:#f9f5f6; font-size:18px; font-weight:800; letter-spacing:.08em; }
    .status { margin-top:16px; padding:12px; border-left:4px solid #741321; background:#f9f5f6; white-space:pre-wrap; }
    .status:empty { display:none; }
    .actions { display:flex; flex-wrap:wrap; gap:9px; }
    [hidden] { display:none !important; }
    @media (max-width:540px) { .captcha-row { grid-template-columns:1fr; } button,.button { width:100%; text-align:center; } }
  </style>
</head>
<body class="candidate-institutional">
  <header><h1>Candidate Password Reset</h1></header>
  <main>
    <section class="card" id="requestCard">
      <h2>Request Reset Link</h2>
      <p>Enter your registration ID and registered email address. A single-use link will be sent if the details match.</p>
      <form id="requestForm">
        <label for="registrationId">Registration ID</label>
        <input id="registrationId" autocomplete="username" required>
        <label for="email">Registered Email</label>
        <input id="email" type="email" autocomplete="email" required>
        <label for="captchaAnswer">Security Check</label>
        <div class="captcha-box" id="captchaPrompt">Loading...</div>
        <div class="captcha-row">
          <input id="captchaAnswer" inputmode="numeric" autocomplete="off" required>
          <button class="secondary" type="button" id="refreshCaptcha">New Challenge</button>
        </div>
        <button type="submit">Send Reset Link</button>
      </form>
      <div class="status" id="requestStatus"></div>
    </section>

    <section class="card" id="confirmCard" hidden>
      <h2>Choose New Password</h2>
      <p>Use at least 12 characters with uppercase, lowercase, number, and symbol.</p>
      <form id="confirmForm">
        <label for="newPassword">New Password</label>
        <input id="newPassword" type="password" autocomplete="new-password" minlength="12" required>
        <label for="confirmPassword">Confirm New Password</label>
        <input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" required>
        <button type="submit">Save New Password</button>
      </form>
      <div class="status" id="confirmStatus"></div>
    </section>

    <div class="actions"><a class="button secondary" href="/candidate-entry/dashboard">Back To Candidate Login</a></div>
  </main>
  <script>
    let challengeId = '';
    const resetToken = new URLSearchParams(location.search).get('token') || '';
    if (resetToken) history.replaceState(null, '', '/candidate-entry/reset-password?reset=1');

    async function candidateSecurityToken() {
      if (window.__candidateSecurityTokenCache) return window.__candidateSecurityTokenCache;
      const response = await fetch('/api/public/candidate-security-token', {cache:'no-store'});
      const data = await response.json();
      window.__candidateSecurityTokenCache = data.token || '';
      return window.__candidateSecurityTokenCache;
    }

    async function postJson(url, payload) {
      const response = await fetch(url, {
        method:'POST',
        headers:{'Content-Type':'application/json', 'X-Candidate-CSRF':await candidateSecurityToken()},
        body:JSON.stringify(payload)
      });
      const text = await response.text();
      const data = text ? JSON.parse(text) : {};
      if (!response.ok) throw new Error(data.detail || data.message || 'Request could not be completed.');
      return data;
    }

    async function loadCaptcha() {
      const response = await fetch('/api/public/candidate-password-reset/captcha', {cache:'no-store'});
      const data = await response.json();
      challengeId = data.challengeId || '';
      document.getElementById('captchaPrompt').textContent = data.prompt || 'Request a new challenge.';
      document.getElementById('captchaAnswer').value = '';
    }

    document.getElementById('refreshCaptcha').addEventListener('click', loadCaptcha);
    document.getElementById('requestForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const status = document.getElementById('requestStatus');
      status.textContent = 'Checking request...';
      try {
        const data = await postJson('/api/public/candidate-password-reset/request', {
          registrationId:document.getElementById('registrationId').value.trim(),
          email:document.getElementById('email').value.trim(),
          challengeId,
          captchaAnswer:document.getElementById('captchaAnswer').value.trim()
        });
        status.textContent = data.message;
        await loadCaptcha();
      } catch (error) {
        status.textContent = error.message;
        await loadCaptcha();
      }
    });

    document.getElementById('confirmForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const status = document.getElementById('confirmStatus');
      status.textContent = 'Saving password...';
      try {
        const data = await postJson('/api/public/candidate-password-reset/confirm', {
          token:resetToken,
          newPassword:document.getElementById('newPassword').value,
          confirmPassword:document.getElementById('confirmPassword').value
        });
        status.textContent = data.message;
        document.getElementById('confirmForm').hidden = true;
      } catch (error) {
        status.textContent = error.message;
      }
    });

    if (resetToken) {
      document.getElementById('requestCard').hidden = true;
      document.getElementById('confirmCard').hidden = false;
    } else {
      loadCaptcha().catch(() => {
        document.getElementById('captchaPrompt').textContent = 'Security check unavailable. Refresh the page.';
      });
    }
  </script>
</body>
</html>
