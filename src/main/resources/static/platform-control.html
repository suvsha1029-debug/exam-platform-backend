<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Platform Control Panel</title>
  <style>
    * { box-sizing:border-box; border-radius:0!important; box-shadow:none!important; text-shadow:none!important; }
    :root { --dark:#1f242b; --navy:#071f3d; --red:#9f1f32; --green:#9adfc9; --paper:#f3f5f7; --line:#677385; --ink:#111923; }
    body { margin:0; color:var(--ink); background:#cfd6de; font-family:Tahoma,Verdana,Arial,sans-serif; }
    header { border-top:5px solid var(--red); border-bottom:3px solid #101820; background:linear-gradient(90deg,var(--dark),var(--navy)); color:#fff; }
    .head { width:min(1280px,calc(100% - 28px)); margin:auto; padding:18px 0; display:flex; justify-content:space-between; gap:14px; align-items:center; }
    h1 { margin:0; font-size:27px; letter-spacing:.04em; }
    .head small { color:#cfe0ef; }
    .head a { border:1px solid #b7c2cd; background:#fff; color:#071f3d; padding:8px 12px; text-decoration:none; font-weight:800; }
    main { width:min(1280px,calc(100% - 28px)); margin:18px auto 40px; display:grid; grid-template-columns:280px 1fr; gap:16px; align-items:start; }
    .panel { border:2px solid var(--line); background:var(--paper); }
    .panel h2 { margin:0; padding:12px 14px; border-bottom:2px solid var(--line); background:#fff; color:#071f3d; font-size:20px; }
    .filters { padding:14px; display:grid; gap:9px; }
    button, select, textarea { font:13px Tahoma,Verdana,Arial,sans-serif; }
    button { border:1px solid #071f3d; background:#071f3d; color:#fff; padding:8px 12px; font-weight:800; cursor:pointer; }
    button.red { border-color:#7e1626; background:#9f1f32; }
    button.green { border-color:#347864; background:#dffff5; color:#0b4434; }
    button.light { background:#fff; color:#071f3d; }
    select, textarea { width:100%; border:1px solid #667385; background:#fff; color:#111923; padding:8px; }
    textarea { min-height:78px; resize:vertical; }
    .summary { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; padding:14px; border-bottom:2px solid var(--line); background:#e9edf1; }
    .metric { border:1px solid #8995a4; background:#fff; padding:10px; }
    .metric b { display:block; font-size:22px; color:#071f3d; }
    .list { padding:14px; display:grid; gap:12px; }
    .request { border:2px solid #8995a4; background:#fff; }
    .request-head { display:flex; justify-content:space-between; gap:12px; align-items:center; padding:10px 12px; background:#f7f9fb; border-bottom:1px solid #b8c0c9; }
    .request h3 { margin:0; color:#111923; font-size:18px; }
    .badge { display:inline-block; min-width:104px; text-align:center; padding:5px 8px; border:1px solid #333; font-weight:800; font-size:12px; }
    .PENDING { background:#fff7dd; color:#6b4c00; }
    .UNDER_REVIEW { background:#e2f1ff; color:#073a70; }
    .APPROVED { background:#e8fff7; color:#0d5b43; }
    .REJECTED { background:#fff0f3; color:#86182a; }
    .grid { padding:12px; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px 18px; font-size:13px; }
    .field strong { color:#31465c; display:block; font-size:11px; letter-spacing:.06em; text-transform:uppercase; margin-bottom:2px; }
    .wide { grid-column:1 / -1; }
    .actions { padding:12px; border-top:1px solid #b8c0c9; background:#f7f9fb; display:grid; grid-template-columns:1fr auto auto auto; gap:8px; align-items:start; }
    .empty { padding:22px; border:1px dashed #8995a4; background:#fff; color:#44566a; }
    @media (max-width:900px) { main { grid-template-columns:1fr; } .summary, .grid, .actions { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header>
    <div class="head">
      <div>
        <h1>Platform Control Panel</h1>
        <small>Institute request intake, service approval, and access onboarding foundation</small>
      </div>
      <a href="/logout">Sign Out</a>
    </div>
  </header>
  <main>
    <aside class="panel">
      <h2>Control</h2>
      <div class="filters">
        <label for="statusFilter"><strong>Status Filter</strong></label>
        <select id="statusFilter">
          <option value="ALL">All Requests</option>
          <option value="PENDING">Pending</option>
          <option value="UNDER_REVIEW">Under Review</option>
          <option value="APPROVED">Approved</option>
          <option value="REJECTED">Rejected</option>
        </select>
        <button type="button" onclick="loadRequests()">Refresh</button>
        <button class="light" type="button" onclick="location.href='/service-request.html'">Open Public Request Page</button>
      </div>
    </aside>
    <section class="panel">
      <h2>Institute Service Requests</h2>
      <div class="summary">
        <div class="metric"><b id="mAll">0</b>All</div>
        <div class="metric"><b id="mPending">0</b>Pending</div>
        <div class="metric"><b id="mReview">0</b>Review</div>
        <div class="metric"><b id="mApproved">0</b>Approved</div>
      </div>
      <div id="requestList" class="list"><div class="empty">Loading requests...</div></div>
    </section>
  </main>
  <script>
    const listEl = document.getElementById('requestList');
    const statusFilter = document.getElementById('statusFilter');
    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }
    async function api(path, options = {}) {
      const response = await fetch(path, options);
      const text = await response.text();
      const data = text ? JSON.parse(text) : null;
      if (!response.ok) throw new Error((data && data.detail) || 'Request failed.');
      return data;
    }
    async function loadRequests() {
      listEl.innerHTML = '<div class="empty">Loading requests...</div>';
      try {
        const rows = await api('/api/platform/institute-requests?status=' + encodeURIComponent(statusFilter.value));
        renderRows(rows || []);
      } catch (error) {
        listEl.innerHTML = '<div class="empty">' + esc(error.message) + '</div>';
      }
    }
    function renderRows(rows) {
      const counts = { PENDING:0, UNDER_REVIEW:0, APPROVED:0, REJECTED:0 };
      rows.forEach(row => counts[row.status] = (counts[row.status] || 0) + 1);
      document.getElementById('mAll').textContent = rows.length;
      document.getElementById('mPending').textContent = counts.PENDING || 0;
      document.getElementById('mReview').textContent = counts.UNDER_REVIEW || 0;
      document.getElementById('mApproved').textContent = counts.APPROVED || 0;
      if (!rows.length) {
        listEl.innerHTML = '<div class="empty">No institute service requests found.</div>';
        return;
      }
      listEl.innerHTML = rows.map(row => `
        <article class="request">
          <div class="request-head">
            <h3>${esc(row.instituteName)}</h3>
            <span class="badge ${esc(row.status)}">${esc(row.status)}</span>
          </div>
          <div class="grid">
            <div class="field"><strong>Request ID</strong>${esc(row.id)}</div>
            <div class="field"><strong>Created</strong>${esc(new Date(row.createdAt).toLocaleString())}</div>
            <div class="field"><strong>Contact</strong>${esc(row.contactName)}${row.designation ? ' - ' + esc(row.designation) : ''}</div>
            <div class="field"><strong>Email / Phone</strong>${esc(row.officialEmail)} / ${esc(row.phoneNumber)}</div>
            <div class="field wide"><strong>Services</strong>${esc(row.requestedServices)}</div>
            <div class="field wide"><strong>Address</strong>${esc(row.instituteAddress || '-')}</div>
            <div class="field wide"><strong>Institute Notes</strong>${esc(row.notes || '-')}</div>
            <div class="field wide"><strong>Platform Notes</strong>${esc(row.platformNotes || '-')}</div>
          </div>
          <div class="actions">
            <textarea id="note-${row.id}" placeholder="Platform note for this request">${esc(row.platformNotes || '')}</textarea>
            <button type="button" onclick="act(${row.id}, 'review')">Under Review</button>
            <button class="green" type="button" onclick="act(${row.id}, 'approve')">Approve</button>
            <button class="red" type="button" onclick="act(${row.id}, 'reject')">Reject</button>
          </div>
        </article>
      `).join('');
    }
    async function act(id, action) {
      const note = document.getElementById('note-' + id).value;
      try {
        await api('/api/platform/institute-requests/' + id + '/' + action, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ platformNotes: note })
        });
        await loadRequests();
      } catch (error) {
        alert(error.message);
      }
    }
    statusFilter.addEventListener('change', loadRequests);
    loadRequests();
  </script>
</body>
</html>
